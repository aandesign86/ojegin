<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEGIN - Buat Pesanan</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    
    .autocomplete-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 9999;
      max-height: 200px;
      overflow-y: auto;
    }
    .autocomplete-item {
      padding: 10px 14px;
      font-size: 12px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
    }
    .autocomplete-item:hover {
      background-color: #f0fdf4;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between">

  <!-- Header Dinamis -->
  <header class="bg-white px-4 py-3 flex items-center gap-3 sticky top-0 z-30 shadow-sm">
    <a href="pelanggan.html" class="w-9 h-9 flex items-center justify-center bg-gray-100 rounded-full font-bold text-gray-700 hover:bg-gray-200 transition">&larr;</a>
    <div class="flex items-center gap-2.5">
      <div id="service-icon-container" class="w-9 h-9 rounded-xl bg-emerald-50 flex items-center justify-center text-xl"></div>
      <div>
        <h1 id="service-title" class="text-base font-bold text-gray-900">Pesan OJEGIN</h1>
        <p class="text-[10px] text-gray-500">Geser pin pada peta untuk lokasi presisi</p>
      </div>
    </div>
  </header>

  <!-- Content Container -->
  <div class="p-4 space-y-4 flex-grow flex flex-col">
    
    <!-- BOX PUTIH UTAMA -->
    <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-200 space-y-3">
      
      <!-- 1. Peta Satelit -->
      <div class="w-full h-[200px] bg-gray-200 rounded-xl overflow-hidden relative border border-gray-100">
        <div id="map" class="w-full h-full"></div>
      </div>

      <!-- 2. Section Khusus FOOD (Merchant & Menu dengan Kolom Jumlah) -->
      <div id="food-merchant-section" class="hidden space-y-3 bg-amber-50/60 p-3.5 rounded-xl border border-amber-200">
        <div>
          <label class="text-[10px] font-bold text-amber-800 uppercase tracking-wider block mb-1">Pilih Merchant / Toko Makanan</label>
          <select id="merchant-select" onchange="changeMerchant()" class="w-full bg-white border border-amber-300 text-xs font-semibold text-gray-800 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-amber-500">
            <!-- Koordinat merchant disertakan langsung di atribut data-lat & data-lng -->
            <option value="resto1" data-lat="-6.3015" data-lng="107.1485">Nasi Goreng & Ayam Penyet Pak Mul</option>
            <option value="resto2" data-lat="-6.3080" data-lng="107.1550">Warung Seblak & Baso Aci Teh Ita</option>
            <option value="resto3" data-lat="-6.2950" data-lng="107.1420">Kopi Kenangan & Roti Bakar</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-amber-800 uppercase tracking-wider block mb-1.5">Pilih Menu & Jumlah</label>
          <div id="menu-container" class="space-y-2 max-h-[180px] overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- 3. Section Khusus KIRIM PAKET -->
      <div id="paket-detail-section" class="hidden space-y-3 bg-blue-50/60 p-3.5 rounded-xl border border-blue-200">
        <h2 class="text-xs font-bold text-blue-900 uppercase tracking-wider">Data & Keterangan Penerima Paket</h2>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[9px] font-bold text-gray-500 block mb-1">Nama Penerima</label>
            <input type="text" id="penerima-nama" placeholder="Contoh: Budi Santoso" class="w-full bg-white border border-blue-200 text-xs font-semibold text-gray-800 rounded-lg p-2 outline-none">
          </div>
          <div>
            <label class="text-[9px] font-bold text-gray-500 block mb-1">No. HP / WhatsApp</label>
            <input type="tel" id="penerima-hp" placeholder="Contoh: 0812xxxxxxxx" class="w-full bg-white border border-blue-200 text-xs font-semibold text-gray-800 rounded-lg p-2 outline-none">
          </div>
        </div>
        <div>
          <label class="text-[9px] font-bold text-gray-500 block mb-1">Detail Barang & Catatan</label>
          <input type="text" id="penerima-catatan" placeholder="Contoh: Kotak kardus / Dokumen penting" class="w-full bg-white border border-blue-200 text-xs font-semibold text-gray-800 rounded-lg p-2 outline-none">
        </div>
      </div>

      <!-- 4. Form Pemesanan Lokasi -->
      <div class="space-y-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        
        <!-- Lokasi Jemput -->
        <div id="pickup-container" class="flex items-start gap-3 relative">
          <div class="w-3 h-3 rounded-full bg-emerald-500 flex-shrink-0 ring-4 ring-emerald-100 mt-3"></div>
          <div class="flex-grow relative">
            <label id="pickup-label" class="text-[9px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Lokasi Jemput (Pin Hijau)</label>
            <div class="relative flex items-center bg-white border border-gray-300 rounded-lg px-3 py-2">
              <input type="text" id="pickup-input" placeholder="Cari Lokasi Jemput..." class="w-full bg-transparent text-xs font-semibold text-gray-800 outline-none pr-12">
              <button type="button" id="clear-pickup" onclick="clearInput('pickup-input', 'pickup-results')" class="hidden text-gray-400 font-bold text-xs bg-gray-200 rounded-full w-4 h-4 flex items-center justify-center mr-1.5">&times;</button>
              <button type="button" onclick="getGPSLocation()" class="p-1.5 bg-emerald-50 text-emerald-600 rounded-full border border-emerald-200"><svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg></button>
            </div>
            <div id="pickup-results" class="autocomplete-box hidden"></div>
          </div>
        </div>

        <div id="pickup-divider" class="border-t border-gray-200 my-1 ml-6"></div>

        <!-- Lokasi Tujuan -->
        <div class="flex items-start gap-3 relative">
          <div class="w-3 h-3 rounded-full bg-red-500 flex-shrink-0 ring-4 ring-red-100 mt-3"></div>
          <div class="flex-grow relative">
            <label id="dest-label" class="text-[9px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Lokasi Tujuan (Pin Merah)</label>
            <div class="relative flex items-center bg-white border border-gray-300 rounded-lg px-3 py-2">
              <input type="text" id="dest-input" placeholder="Cari Lokasi Tujuan..." class="w-full bg-transparent text-xs font-semibold text-gray-800 outline-none pr-12">
              <button type="button" id="clear-dest" onclick="clearInput('dest-input', 'dest-results')" class="hidden text-gray-400 font-bold text-xs bg-gray-200 rounded-full w-4 h-4 flex items-center justify-center mr-1.5">&times;</button>
              <button type="button" onclick="getGPSDestLocation()" class="p-1.5 bg-emerald-50 text-emerald-600 rounded-full border border-emerald-200"><svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg></button>
            </div>
            <div id="dest-results" class="autocomplete-box hidden"></div>
          </div>
        </div>

      </div>

      <!-- Estimasi Harga -->
      <div class="space-y-1.5 text-xs px-2 pt-1">
        <div id="food-subtotal-row" class="hidden justify-between text-gray-500">
          <span>Subtotal Makanan</span>
          <span id="food-price-label">Rp 0</span>
        </div>
        <div class="flex justify-between text-gray-500">
          <span id="ongkir-text">Estimasi Jarak</span>
          <span id="distance-label">0 km</span>
        </div>
        <div class="flex justify-between text-sm font-bold text-gray-900 pt-2 border-t border-gray-100">
          <span>Total Pembayaran</span>
          <span id="total-price" class="text-emerald-600 text-base">Rp 0</span>
        </div>
      </div>

      <button onclick="submitOrder()" class="w-full bg-[#00B14F] hover:bg-[#009442] text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/30 text-sm mt-2">
        Pesan Sekarang
      </button>
    </div>

  </div>

  <script>
    let pickupLatLng = null;
    let destLatLng = null;
    let map = null;
    let pickupMarker = null;
    let destMarker = null;
    let routeLine = null;
    let selectedFoodTotal = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const serviceParam = (urlParams.get('service') || 'bike').toLowerCase();

    const serviceConfig = {
      bike: { title: 'OJEGIN Bike', pickupText: 'Lokasi Penjemputan', destText: 'Lokasi Tujuan', icon: '🛵' },
      car: { title: 'OJEGIN Car', pickupText: 'Lokasi Penjemputan', destText: 'Lokasi Tujuan', icon: '🚗' },
      food: { title: 'OJEGIN Food', destText: 'Lokasi Pengantaran Makanan', icon: '🍔' },
      paket: { title: 'Kirim Paket', pickupText: 'Lokasi Pengambilan Paket', destText: 'Lokasi Tujuan Penerima', icon: '📦' }
    };

    let currentKey = 'bike';
    if (serviceParam === 'car' || serviceParam === 'mobil') currentKey = 'car';
    else if (serviceParam === 'food') currentKey = 'food';
    else if (serviceParam === 'paket' || serviceParam === 'send' || serviceParam === 'kirim') currentKey = 'paket';

    const currentConfig = serviceConfig[currentKey];
    document.getElementById('service-title').innerText = currentConfig.title;
    document.getElementById('service-icon-container').innerText = currentConfig.icon;
    document.getElementById('pickup-label').innerText = currentConfig.pickupText;
    document.getElementById('dest-label').innerText = currentConfig.destText;

    const merchantData = {
      resto1: [
        { name: 'Nasi Goreng Spesial', price: 18000 },
        { name: 'Ayam Penyet Sambal Ijo', price: 20000 },
        { name: 'Es Teh Manis', price: 5000 }
      ],
      resto2: [
        { name: 'Seblak Komplit Seafood', price: 16000 },
        { name: 'Baso Aci Kuah Pedas', price: 14000 },
        { name: 'Es Jeruk Peras', price: 6000 }
      ],
      resto3: [
        { name: 'Kopi Kenangan Mantan (Large)', price: 24000 },
        { name: 'Roti Bakar Cokelat Keju', price: 15000 }
      ]
    };

    if (currentKey === 'food') {
      document.getElementById('pickup-container').classList.add('hidden');
      document.getElementById('pickup-divider').classList.add('hidden');
      document.getElementById('food-merchant-section').classList.remove('hidden');
      document.getElementById('food-subtotal-row').classList.remove('hidden');
      document.getElementById('ongkir-text').innerText = 'Ongkos Kirim Makanan';
      
      // Ambil koordinat merchant otomatis dari option yang terpilih
      setMerchantCoordinates();
    } else if (currentKey === 'paket') {
      document.getElementById('paket-detail-section').classList.remove('hidden');
    }

    function setMerchantCoordinates() {
      const select = document.getElementById('merchant-select');
      const selectedOption = select.options[select.selectedIndex];
      const lat = parseFloat(selectedOption.getAttribute('data-lat'));
      const lng = parseFloat(selectedOption.getAttribute('data-lng'));
      
      setPickupLocation(lat, lng);
      loadMerchantMenu();
    }

    function changeMerchant() {
      setMerchantCoordinates();
    }

    function loadMerchantMenu() {
      const selectedResto = document.getElementById('merchant-select').value;
      const menuList = merchantData[selectedResto] || [];
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      menuList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between bg-white p-2.5 rounded-lg border border-amber-100 shadow-xs';
        div.innerHTML = `
          <div>
            <p class="text-xs font-bold text-gray-800">${item.name}</p>
            <p class="text-[11px] font-semibold text-emerald-600">Rp ${item.price.toLocaleString('id-ID')}</p>
          </div>
          <div class="flex items-center gap-2">
            <input type="number" id="qty-${index}" min="0" value="0" onchange="calculateFoodTotal()" data-price="${item.price}" class="w-14 text-center border border-gray-300 rounded-md text-xs font-semibold py-1 outline-none focus:ring-1 focus:ring-amber-500">
          </div>
        `;
        container.appendChild(div);
      });
      calculateFoodTotal();
    }

    function calculateFoodTotal() {
      selectedFoodTotal = 0;
      const qtyInputs = document.querySelectorAll('#menu-container input[type="number"]');
      qtyInputs.forEach(input => {
        let qty = parseInt(input.value) || 0;
        let price = parseInt(input.getAttribute('data-price')) || 0;
        selectedFoodTotal += (qty * price);
      });
      document.getElementById('food-price-label').textContent = `Rp ${selectedFoodTotal.toLocaleString('id-ID')}`;
      updateRoute();
    }

    // --- LEAFLET MAP SETUP ---
    const greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    map = L.map('map', { zoomControl: true }).setView([-2.548926, 118.014863], 5);

    L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Maps Satellite'
    }).addTo(map);

    function setPickupLocation(lat, lng) {
      pickupLatLng = [lat, lng];
      if (!pickupMarker) {
        pickupMarker = L.marker(pickupLatLng, { icon: greenIcon, draggable: currentKey !== 'food' }).addTo(map).bindPopup("Titik Merchant / Jemput");
        if (currentKey !== 'food') {
          pickupMarker.on('dragend', function (e) {
            pickupLatLng = [e.target.getLatLng().lat, e.target.getLatLng().lng];
            reverseGeocode(pickupLatLng[0], pickupLatLng[1], 'pickup-input');
            updateRoute();
          });
        }
      } else {
        pickupMarker.setLatLng(pickupLatLng);
      }
      map.setView(pickupLatLng, 15);
      updateRoute();
    }

    function setDestLocation(lat, lng) {
      destLatLng = [lat, lng];
      if (!destMarker) {
        destMarker = L.marker(destLatLng, { icon: redIcon, draggable: true }).addTo(map).bindPopup("Titik Tujuan");
        destMarker.on('dragend', function (e) {
          destLatLng = [e.target.getLatLng().lat, e.target.getLatLng().lng];
          reverseGeocode(destLatLng[0], destLatLng[1], 'dest-input');
          updateRoute();
        });
      } else {
        destMarker.setLatLng(destLatLng);
      }
      map.setView(destLatLng, 15);
      updateRoute();
    }

    function toggleClearBtn(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (input.value.length > 0) btn.classList.remove('hidden');
      else btn.classList.add('hidden');
    }

    function clearInput(inputId, resultsId) {
      document.getElementById(inputId).value = '';
      document.getElementById(resultsId).classList.add('hidden');
      toggleClearBtn(inputId, inputId === 'pickup-input' ? 'clear-pickup' : 'clear-dest');
    }

    function setupSearchAutocomplete(inputId, resultsId, clearBtnId, onSelect) {
      const input = document.getElementById(inputId);
      const resultsContainer = document.getElementById(resultsId);
      let timer;

      input.addEventListener('input', function () {
        toggleClearBtn(inputId, clearBtnId);
        clearTimeout(timer);
        const query = input.value.trim();
        if (query.length < 3) {
          resultsContainer.classList.add('hidden');
          return;
        }

        timer = setTimeout(() => {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Indonesia')}&limit=5&addressdetails=1`;
          fetch(url, { headers: { 'Accept-Language': 'id' } })
            .then(res => res.json())
            .then(data => {
              resultsContainer.innerHTML = '';
              if (data && data.length > 0) {
                data.forEach(item => {
                  const div = document.createElement('div');
                  div.className = 'autocomplete-item';
                  const mainName = item.display_name.split(',')[0];
                  div.innerHTML = `<strong>${mainName}</strong><br><span class="text-[10px] text-gray-500">${item.display_name}</span>`;
                  div.addEventListener('click', () => {
                    input.value = item.display_name;
                    toggleClearBtn(inputId, clearBtnId);
                    resultsContainer.classList.add('hidden');
                    onSelect(parseFloat(item.lat), parseFloat(item.lon));
                  });
                  resultsContainer.appendChild(div);
                });
                resultsContainer.classList.remove('hidden');
              } else {
                resultsContainer.classList.add('hidden');
              }
            }).catch(() => resultsContainer.classList.add('hidden'));
        }, 400);
      });
    }

    if (currentKey !== 'food') {
      setupSearchAutocomplete('pickup-input', 'pickup-results', 'clear-pickup', (lat, lng) => setPickupLocation(lat, lng));
    }
    setupSearchAutocomplete('dest-input', 'dest-results', 'clear-dest', (lat, lng) => setDestLocation(lat, lng));

    function reverseGeocode(lat, lng, inputId) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.display_name) {
            document.getElementById(inputId).value = data.display_name;
            toggleClearBtn(inputId, inputId === 'pickup-input' ? 'clear-pickup' : 'clear-dest');
          }
        }).catch(() => {});
    }

    function updateRoute() {
      if (!pickupLatLng || !destLatLng) {
        document.getElementById('distance-label').textContent = '0 km';
        let baseTotal = currentKey === 'food' ? selectedFoodTotal : 0;
        document.getElementById('total-price').textContent = `Rp ${baseTotal.toLocaleString('id-ID')}`;
        return;
      }

      const url = `https://router.project-osrm.org/route/v1/driving/${pickupLatLng[1]},${pickupLatLng[0]};${destLatLng[1]},${destLatLng[0]}?overview=full&geometries=geojson`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.routes && data.routes.length > 0) {
            let shortestRoute = data.routes[0];
            const coords = shortestRoute.geometry.coordinates.map(c => [c[1], c[0]]);

            if (routeLine) map.removeLayer(routeLine);
            routeLine = L.polyline(coords, { color: '#00FF66', weight: 5, opacity: 0.95 }).addTo(map);
            map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

            const distanceKm = parseFloat((shortestRoute.distance / 1000).toFixed(1));
            
            let basePrice = (currentKey === 'car') ? 15000 : 9000;
            let perKmRate = (currentKey === 'car') ? 4000 : 2500;

            let ongkir = basePrice;
            if (distanceKm > 4) {
              ongkir += Math.round((distanceKm - 4) * perKmRate);
            }

            let grandTotal = ongkir + selectedFoodTotal;

            document.getElementById('distance-label').textContent = `${distanceKm} km (Rp ${ongkir.toLocaleString('id-ID')})`;
            document.getElementById('total-price').textContent = `Rp ${grandTotal.toLocaleString('id-ID')}`;
          }
        });
    }

    function getGPSLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => setPickupLocation(pos.coords.latitude, pos.coords.longitude),
          () => alert("Gagal mengambil GPS.")
        );
      }
    }

    function getGPSDestLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            setDestLocation(pos.coords.latitude, pos.coords.longitude);
            reverseGeocode(pos.coords.latitude, pos.coords.longitude, 'dest-input');
          },
          () => alert("Gagal mengambil GPS.")
        );
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('dest-input').value = '';
      if (currentKey !== 'food') {
        document.getElementById('pickup-input').value = '';
        getGPSLocation();
      } else {
        getGPSDestLocation();
      }
    });

    function submitOrder() {
      if (!destLatLng) {
        alert('Harap tentukan Lokasi Tujuan terlebih dahulu!');
        return;
      }
      if (currentKey === 'food' && selectedFoodTotal === 0) {
        alert('Harap masukkan jumlah minimal 1 pada salah satu menu makanan!');
        return;
      }
      if (currentKey === 'paket') {
        const nama = document.getElementById('penerima-nama').value.trim();
        const hp = document.getElementById('penerima-hp').value.trim();
        if (!nama || !hp) {
          alert('Harap isi Nama dan No. HP Penerima paket!');
          return;
        }
      }
      alert(`Pesanan ${currentConfig.title} Berhasil Dibuat!`);
      window.location.href = 'pelanggan.html';
    }
  </script>
</body>
</html>
