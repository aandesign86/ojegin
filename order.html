<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEGIN - Buat Pesanan</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    
    .autocomplete-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 9999;
      max-height: 200px;
      overflow-y: auto;
    }
    .autocomplete-item {
      padding: 10px 14px;
      font-size: 12px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
    }
    .autocomplete-item:hover {
      background-color: #f0fdf4;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between">

  <!-- Header Dinamis -->
  <header class="bg-white px-4 py-3 flex items-center gap-3 sticky top-0 z-30 shadow-sm">
    <a href="pelanggan.html" class="w-9 h-9 flex items-center justify-center bg-gray-100 rounded-full font-bold text-gray-700 hover:bg-gray-200 transition">&larr;</a>
    <div class="flex items-center gap-2.5">
      <!-- Ikon Dinamis -->
      <div id="service-icon-container" class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
        <!-- SVG Icon ditempatkan via JS -->
      </div>
      <div>
        <h1 id="service-title" class="text-base font-bold text-gray-900">Pesan OJEGIN</h1>
        <p class="text-[10px] text-gray-500">Geser pin pada peta untuk lokasi presisi</p>
      </div>
    </div>
  </header>

  <!-- Content Container -->
  <div class="p-4 space-y-4 flex-grow flex flex-col">
    
    <!-- BOX PUTIH UTAMA (Menyatukan Peta Satelit & Form Lokasi) -->
    <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-200 space-y-3">
      
      <!-- 1. Peta Satelit di Bagian Atas Box -->
      <div class="w-full h-[220px] bg-gray-200 rounded-xl overflow-hidden relative border border-gray-100">
        <div id="map" class="w-full h-full"></div>
      </div>

      <!-- 2. Form Pemesanan Lokasi -->
      <div class="space-y-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        
        <!-- Lokasi Penjemputan / Pengambilan -->
        <div class="flex items-start gap-3 relative">
          <div class="w-3 h-3 rounded-full bg-emerald-500 flex-shrink-0 ring-4 ring-emerald-100 mt-3"></div>
          <div class="flex-grow relative">
            <div class="flex justify-between items-center mb-1">
              <label id="pickup-label" class="text-[9px] font-bold text-gray-400 uppercase tracking-wider block">Lokasi Jemput (Pin Hijau)</label>
            </div>
            
            <div class="relative flex items-center bg-white border border-gray-300 rounded-lg px-3 py-2 focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 shadow-sm">
              <input type="text" id="pickup-input" placeholder="Cari Desa/Kecamatan/Nama Tempat..." autocomplete="off" class="w-full bg-transparent text-xs font-semibold text-gray-800 outline-none pr-12">
              
              <button type="button" id="clear-pickup" onclick="clearInput('pickup-input', 'pickup-results')" class="hidden text-gray-400 hover:text-gray-600 font-bold text-xs bg-gray-200 rounded-full w-4 h-4 flex items-center justify-center leading-none mr-1.5">&times;</button>
              
              <button type="button" onclick="getGPSLocation()" title="Gunakan Lokasi Saat Ini" class="p-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 hover:text-emerald-700 rounded-full border border-emerald-200 transition-all flex items-center justify-center active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <circle cx="12" cy="12" r="8"></circle>
                  <line x1="12" y1="2" x2="12" y2="4"></line>
                  <line x1="12" y1="20" x2="12" y2="22"></line>
                  <line x1="2" y1="12" x2="4" y2="12"></line>
                  <line x1="20" y1="12" x2="22" y2="12"></line>
                </svg>
              </button>
            </div>
            
            <p class="text-[10px] text-gray-400 leading-tight mt-1 flex items-center gap-1 flex-wrap">
              <span>Ketik Desa/Kecamatan kemudian geser pin sesuai titik koordinat agar presisi atau klik ikon GPS</span>
            </p>
            <div id="pickup-results" class="autocomplete-box hidden"></div>
          </div>
        </div>

        <div class="border-t border-gray-200 my-1 ml-6"></div>

        <!-- Lokasi Tujuan / Pengantaran -->
        <div class="flex items-start gap-3 relative">
          <div class="w-3 h-3 rounded-full bg-red-500 flex-shrink-0 ring-4 ring-red-100 mt-3"></div>
          <div class="flex-grow relative">
            <label id="dest-label" class="text-[9px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Lokasi Tujuan (Pin Merah)</label>
            
            <div class="relative flex items-center bg-white border border-gray-300 rounded-lg px-3 py-2 focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 shadow-sm">
              <input type="text" id="dest-input" placeholder="Cari Desa/Kecamatan/Nama Tempat..." autocomplete="off" class="w-full bg-transparent text-xs font-semibold text-gray-800 outline-none pr-6">
              
              <button type="button" id="clear-dest" onclick="clearInput('dest-input', 'dest-results')" class="hidden text-gray-400 hover:text-gray-600 font-bold text-xs bg-gray-200 rounded-full w-4 h-4 flex items-center justify-center leading-none">&times;</button>
            </div>
            <p class="text-[10px] text-gray-400 leading-tight mt-1">Ketik Desa/Kecamatan kemudian geser pin sesuai titik koordinat agar presisi</p>
            <div id="dest-results" class="autocomplete-box hidden"></div>
          </div>
        </div>

      </div>

      <!-- Estimasi Jarak & Harga -->
      <div class="space-y-1 text-xs px-2 pt-1">
        <div class="flex justify-between text-gray-500">
          <span>Estimasi Jarak (Rute Terdekat)</span>
          <span id="distance-label">0 km</span>
        </div>
        <div class="flex justify-between text-sm font-bold text-gray-900 pt-2 border-t border-gray-100">
          <span>Total Pembayaran</span>
          <span id="total-price" class="text-emerald-600 text-base">Rp 0</span>
        </div>
      </div>

      <button onclick="submitOrder()" class="w-full bg-[#00B14F] hover:bg-[#009442] text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/30 text-sm mt-2">
        Pesan Sekarang
      </button>
    </div>

  </div>

  <script>
    let pickupLatLng = null;
    let destLatLng = null;
    let map = null;
    let pickupMarker = null;
    let destMarker = null;
    let routeLine = null;

    // --- MAPPING 4 LAYANAN: BIKE, CAR, FOOD, KIRIM PAKET ---
    const urlParams = new URLSearchParams(window.location.search);
    const serviceParam = (urlParams.get('service') || 'bike').toLowerCase();

    const serviceConfig = {
      // 1. BIKE (Ojek Motor)
      bike: {
        title: 'OJEGIN Bike',
        pickupText: 'Lokasi Penjemputan (Pin Hijau)',
        destText: 'Lokasi Tujuan (Pin Merah)',
        icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>`
      },
      // 2. CAR (Ojek Mobil)
      car: {
        title: 'OJEGIN Car',
        pickupText: 'Lokasi Penjemputan (Pin Hijau)',
        destText: 'Lokasi Tujuan (Pin Merah)',
        icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 17a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4zM3 9l2-4h14l2 4M3 9h18v8H3V9z"/></svg>`
      },
      // 3. FOOD (Pesan Makanan)
      food: {
        title: 'OJEGIN Food',
        pickupText: 'Lokasi Resto / Toko Makanan',
        destText: 'Lokasi Pengantaran Makanan',
        icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>`
      },
      // 4. KIRIM PAKET / SEND
      paket: {
        title: 'Kirim Paket',
        pickupText: 'Lokasi Pengambilan Paket',
        destText: 'Lokasi Penerima Paket',
        icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>`
      }
    };

    // Alias pendukung agar tetap terbaca meski dipanggil berbeda (misal: 'motor' atau 'send')
    let currentKey = 'bike';
    if (serviceParam === 'car' || serviceParam === 'mobil') currentKey = 'car';
    else if (serviceParam === 'food') currentKey = 'food';
    else if (serviceParam === 'paket' || serviceParam === 'send' || serviceParam === 'kirim_paket' || serviceParam === 'kirimpaket') currentKey = 'paket';

    const currentConfig = serviceConfig[currentKey];
    document.getElementById('service-title').innerText = currentConfig.title;
    document.getElementById('service-icon-container').innerHTML = currentConfig.icon;
    document.getElementById('pickup-label').innerText = currentConfig.pickupText;
    document.getElementById('dest-label').innerText = currentConfig.destText;

    // --- LEAFLET MAP SETUP ---
    const greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    map = L.map('map', { zoomControl: true }).setView([-2.548926, 118.014863], 5);

    // Layer Satelit Google Maps
    L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Maps Satellite'
    }).addTo(map);

    function setPickupLocation(lat, lng) {
      pickupLatLng = [lat, lng];
      if (!pickupMarker) {
        pickupMarker = L.marker(pickupLatLng, { icon: greenIcon, draggable: true }).addTo(map).bindPopup("Titik Awal (Geser Saya)");
        pickupMarker.on('dragend', function (e) {
          pickupLatLng = [e.target.getLatLng().lat, e.target.getLatLng().lng];
          reverseGeocode(pickupLatLng[0], pickupLatLng[1], 'pickup-input');
          updateRoute();
        });
      } else {
        pickupMarker.setLatLng(pickupLatLng);
      }
      map.setView(pickupLatLng, 17);
      updateRoute();
    }

    function setDestLocation(lat, lng) {
      destLatLng = [lat, lng];
      if (!destMarker) {
        destMarker = L.marker(destLatLng, { icon: redIcon, draggable: true }).addTo(map).bindPopup("Titik Tujuan (Geser Saya)");
        destMarker.on('dragend', function (e) {
          destLatLng = [e.target.getLatLng().lat, e.target.getLatLng().lng];
          reverseGeocode(destLatLng[0], destLatLng[1], 'dest-input');
          updateRoute();
        });
      } else {
        destMarker.setLatLng(destLatLng);
      }
      map.setView(destLatLng, 17);
      updateRoute();
    }

    function toggleClearBtn(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (input.value.length > 0) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }

    function clearInput(inputId, resultsId) {
      document.getElementById(inputId).value = '';
      document.getElementById(resultsId).classList.add('hidden');
      toggleClearBtn(inputId, inputId === 'pickup-input' ? 'clear-pickup' : 'clear-dest');
    }

    function setupSearchAutocomplete(inputId, resultsId, clearBtnId, onSelect) {
      const input = document.getElementById(inputId);
      const resultsContainer = document.getElementById(resultsId);
      let timer;

      input.addEventListener('input', function () {
        toggleClearBtn(inputId, clearBtnId);
        clearTimeout(timer);
        const query = input.value.trim();
        if (query.length < 3) {
          resultsContainer.classList.add('hidden');
          return;
        }

        timer = setTimeout(() => {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Indonesia')}&limit=5&addressdetails=1`;

          fetch(url, { headers: { 'Accept-Language': 'id' } })
            .then(res => res.json())
            .then(data => {
              resultsContainer.innerHTML = '';
              if (data && data.length > 0) {
                data.forEach(item => {
                  const div = document.createElement('div');
                  div.className = 'autocomplete-item';
                  const mainName = item.display_name.split(',')[0];
                  div.innerHTML = `<strong>${mainName}</strong><br><span class="text-[10px] text-gray-500">${item.display_name}</span>`;

                  div.addEventListener('click', () => {
                    input.value = item.display_name;
                    toggleClearBtn(inputId, clearBtnId);
                    resultsContainer.classList.add('hidden');
                    onSelect(parseFloat(item.lat), parseFloat(item.lon));
                  });

                  resultsContainer.appendChild(div);
                });
                resultsContainer.classList.remove('hidden');
              } else {
                resultsContainer.classList.add('hidden');
              }
            })
            .catch(() => resultsContainer.classList.add('hidden'));
        }, 400);
      });
    }

    setupSearchAutocomplete('pickup-input', 'pickup-results', 'clear-pickup', (lat, lng) => {
      setPickupLocation(lat, lng);
    });

    setupSearchAutocomplete('dest-input', 'dest-results', 'clear-dest', (lat, lng) => {
      setDestLocation(lat, lng);
    });

    function reverseGeocode(lat, lng, inputId) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.display_name) {
            document.getElementById(inputId).value = data.display_name;
            toggleClearBtn(inputId, inputId === 'pickup-input' ? 'clear-pickup' : 'clear-dest');
          }
        }).catch(() => {});
    }

    function updateRoute() {
      if (!pickupLatLng || !destLatLng) {
        document.getElementById('distance-label').textContent = '0 km';
        document.getElementById('total-price').textContent = 'Rp 0';
        return;
      }

      const url = `https://router.project-osrm.org/route/v1/driving/${pickupLatLng[1]},${pickupLatLng[0]};${destLatLng[1]},${destLatLng[0]}?overview=full&geometries=geojson&alternatives=true`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.routes && data.routes.length > 0) {
            let shortestRoute = data.routes.reduce((min, route) => route.distance < min.distance ? route : min, data.routes[0]);

            const coords = shortestRoute.geometry.coordinates.map(c => [c[1], c[0]]);
            if (routeLine) map.removeLayer(routeLine);

            routeLine = L.polyline(coords, { color: '#00FF66', weight: 5, opacity: 0.95 }).addTo(map);
            map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

            const distanceKm = parseFloat((shortestRoute.distance / 1000).toFixed(1));
            
            // Penyesuaian tarif dasar per jenis kendaraan
            let basePrice = currentKey === 'car' ? 15000 : 9000;
            let perKmRate = currentKey === 'car' ? 4000 : 2500;

            let price = basePrice;
            if (distanceKm > 4) {
              price += Math.round((distanceKm - 4) * perKmRate);
            }

            document.getElementById('distance-label').textContent = `${distanceKm} km`;
            document.getElementById('total-price').textContent = `Rp ${price.toLocaleString('id-ID')}`;
          }
        });
    }

    function getGPSLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            setPickupLocation(lat, lng);
            reverseGeocode(lat, lng, 'pickup-input');
          },
          err => {
            alert("Gagal mendeteksi lokasi HP. Pastikan GPS/Lokasi pada HP Anda sudah diaktifkan.");
            console.warn("GPS error:", err.message);
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        alert("Fitur GPS tidak didukung oleh browser Anda.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('pickup-input').value = '';
      document.getElementById('dest-input').value = '';
      getGPSLocation();
    });

    function submitOrder() {
      if (!pickupLatLng || !destLatLng) {
        alert('Harap tentukan lokasi awal dan tujuan terlebih dahulu!');
        return;
      }
      alert(`Pesanan ${currentConfig.title} Berhasil Dibuat!`);
      window.location.href = 'pelanggan.html';
    }
  </script>
</body>
</html>
