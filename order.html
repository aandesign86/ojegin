<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEGIN - Pemesanan Layanan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-12 text-gray-800">

  <!-- Header Pemesanan -->
  <header class="bg-white px-5 py-3 flex items-center gap-3 sticky top-0 z-30 border-b border-gray-100 shadow-sm">
    <a href="pelanggan.html" class="p-2 bg-gray-100 rounded-full font-bold text-gray-600 hover:bg-emerald-100 hover:text-emerald-700 transition">
      &larr;
    </a>
    <div>
      <h1 class="text-base font-bold text-gray-800" id="service-title">Pesan Layanan</h1>
      <p class="text-[10px] text-gray-400">Pilih titik penjemputan & tujuan</p>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Simulasi Peta Virtual -->
    <div class="w-full h-44 bg-emerald-100 rounded-3xl relative overflow-hidden border border-emerald-200 flex items-center justify-center">
      <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#059669_1px,transparent_1px)] [background-size:16px_16px]"></div>
      <div class="text-center z-10 p-3">
        <span class="text-3xl animate-bounce inline-block">📍</span>
        <p class="text-xs font-bold text-emerald-800 mt-1">Sistem Peta Rute OJEGIN</p>
        <p class="text-[10px] text-emerald-600">Pelacakan Presisi Berbasis GPS</p>
      </div>
    </div>

    <!-- Form Pemesanan -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-4">
      
      <!-- Input Lokasi -->
      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Lokasi Penjemputan / Asal</label>
          <input type="text" id="pickup-location" value="Jl. Merdeka No. 12" class="w-full border p-3 rounded-2xl text-xs mt-1 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Lokasi Tujuan</label>
          <input type="text" id="destination-location" placeholder="Masukkan lokasi tujuan..." class="w-full border p-3 rounded-2xl text-xs mt-1 focus:ring-2 focus:ring-emerald-500 outline-none" oninput="calculatePrice()">
        </div>
      </div>

      <!-- Opsi Metode Pembayaran -->
      <div class="border-t pt-3">
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Metode Pembayaran</label>
        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl mt-1 border border-gray-100">
          <div class="flex items-center gap-2">
            <span class="text-lg">💳</span>
            <div>
              <p class="text-xs font-bold text-gray-800">OJEGIN-PAY</p>
              <p class="text-[10px] text-gray-400" id="current-balance-label">Saldo: Rp --</p>
            </div>
          </div>
          <span class="text-xs font-bold text-emerald-600 uppercase">Utama</span>
        </div>
      </div>

      <!-- Detail Ringkasan Harga -->
      <div class="border-t pt-3 space-y-1.5 text-xs">
        <div class="flex justify-between text-gray-500">
          <span>Tarif Dasar</span>
          <span id="base-price">Rp 0</span>
        </div>
        <div class="flex justify-between text-emerald-600 font-semibold" id="promo-row" style="display:none;">
          <span>Voucher Promo Applied</span>
          <span id="promo-discount">-Rp 0</span>
        </div>
        <div class="flex justify-between text-sm font-bold text-gray-800 pt-2 border-t">
          <span>Total Pembayaran</span>
          <span id="total-price" class="text-emerald-600">Rp 0</span>
        </div>
      </div>

      <!-- Tombol Eksekusi Order -->
      <button onclick="submitOrder()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-2xl hover:bg-emerald-700 transition shadow-lg active:scale-95">
        Pesan Sekarang
      </button>

    </div>

  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const serviceType = urlParams.get('service') || 'bike';

    const serviceConfig = {
      bike: { title: 'Pesan OJEGIN Bike 🛵', rate: 10000 },
      car: { title: 'Pesan OJEGIN Car 🚗', rate: 25000 },
      food: { title: 'Pesan OJEGIN Food 🍔', rate: 15000 },
      send: { title: 'OJEGIN Kirim Barang 📦', rate: 12000 }
    };

    const currentConfig = serviceConfig[serviceType] || serviceConfig.bike;
    document.getElementById('service-title').textContent = currentConfig.title;

    let balance = parseInt(localStorage.getItem('ojegin_balance')) || 150000;
    document.getElementById('current-balance-label').textContent = `Saldo: Rp ${balance.toLocaleString('id-ID')}`;

    let baseAmount = currentConfig.rate;
    let finalAmount = baseAmount;

    function calculatePrice() {
      const dest = document.getElementById('destination-location').value;
      baseAmount = dest.length > 0 ? currentConfig.rate + (dest.length * 500) : currentConfig.rate;
      
      let discount = 0;
      const activePromo = localStorage.getItem('ojegin_active_promo');
      if (activePromo === 'OJEGINNEW') {
        discount = Math.min(baseAmount * 0.5, 15000);
        document.getElementById('promo-row').style.display = 'flex';
        document.getElementById('promo-discount').textContent = `-Rp ${discount.toLocaleString('id-ID')}`;
      }

      finalAmount = Math.max(0, baseAmount - discount);
      document.getElementById('base-price').textContent = `Rp ${baseAmount.toLocaleString('id-ID')}`;
      document.getElementById('total-price').textContent = `Rp ${finalAmount.toLocaleString('id-ID')}`;
    }

    calculatePrice();

    function submitOrder() {
      const dest = document.getElementById('destination-location').value;
      if (!dest) return alert('Harap isi lokasi tujuan terlebih dahulu!');
      if (finalAmount > balance) return alert('Saldo OJEGIN-PAY Anda tidak mencukupi, silakan isi ulang saldo terlebih dahulu!');

      // Kurangi saldo & simpan histori
      balance -= finalAmount;
      localStorage.setItem('ojegin_balance', balance);

      let transactions = JSON.parse(localStorage.getItem('ojegin_transactions')) || [];
      transactions.unshift({
        type: serviceType,
        title: `${currentConfig.title} ke ${dest}`,
        amount: -finalAmount,
        date: 'Baru saja',
        status: 'Selesai',
        icon: serviceType === 'bike' ? '🛵' : serviceType === 'car' ? '🚗' : serviceType === 'food' ? '🍔' : '📦'
      });
      localStorage.setItem('ojegin_transactions', JSON.stringify(transactions));
      localStorage.removeItem('ojegin_active_promo'); // Reset promo setelah pakai

      alert('Pesanan Berhasil Diproses! Driver sedang menuju lokasi Anda.');
      window.location.href = 'pelanggan.html';
    }
  </script>
</body>
</html>
