<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEGIN - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header Navigasi -->
  <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wider">OJEGIN <span class="text-xs bg-emerald-900 px-2 py-1 rounded font-normal ml-2">ADMIN PANEL</span></h1>
      <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded font-semibold transition">Keluar</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">

    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 font-semibold">Total Pengguna</p>
        <h3 id="stat-users" class="text-2xl font-extrabold text-emerald-600 mt-1">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 font-semibold">Mitra Driver</p>
        <h3 id="stat-drivers" class="text-2xl font-extrabold text-blue-600 mt-1">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 font-semibold">Mitra Merchant</p>
        <h3 id="stat-merchants" class="text-2xl font-extrabold text-purple-600 mt-1">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 font-semibold">Total Transaksi</p>
        <h3 id="stat-orders" class="text-2xl font-extrabold text-orange-600 mt-1">0</h3>
      </div>
    </div>

    <!-- Tabel Daftar Pengguna & Role -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-gray-800">Manajemen Pengguna System</h2>
        <span class="text-xs text-gray-500">Realtime Firestore Sync</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 border-b border-gray-200">
              <th class="p-3">Nama Lengkap</th>
              <th class="p-3">Email</th>
              <th class="p-3">Peran (Role)</th>
              <th class="p-3">Status ID</th>
            </tr>
          </thead>
          <tbody id="user-list-table" class="divide-y divide-gray-100">
            <tr>
              <td colspan="4" class="p-4 text-center text-gray-400">Memuat data pengguna...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhY_GI48jtnzZ0XpOTLY66iaTUW3qwe_8",
      authDomain: "ojegin-92c72.firebaseapp.com",
      projectId: "ojegin-92c72",
      storageBucket: "ojegin-92c72.firebasestorage.app",
      messagingSenderId: "1077908821084",
      appId: "1:1077908821084:web:873b3d23ead38cb8c94299"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.logout = function() {
      signOut(auth).then(() => { window.location.href = "login.html"; });
    };

    // Load Data Realtime Users
    onSnapshot(collection(db, "users"), (snapshot) => {
      const tbody = document.getElementById("user-list-table");
      tbody.innerHTML = "";

      let cCount = 0, dCount = 0, mCount = 0;

      snapshot.forEach((doc) => {
        const u = doc.data();
        if(u.role === 'driver') dCount++;
        else if(u.role === 'merchant') mCount++;
        else cCount++;

        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-3 font-semibold text-gray-800">${u.nama || '-'}</td>
          <td class="p-3 text-gray-600">${u.email || '-'}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
              u.role === 'driver' ? 'bg-blue-100 text-blue-700' :
              u.role === 'merchant' ? 'bg-purple-100 text-purple-700' :
              u.role === 'admin' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'
            }">${(u.role || 'customer').toUpperCase()}</span>
          </td>
          <td class="p-3 font-mono text-[10px] text-gray-400">${doc.id.substring(0, 10)}...</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("stat-users").innerText = snapshot.size;
      document.getElementById("stat-drivers").innerText = dCount;
      document.getElementById("stat-merchants").innerText = mCount;
    });
  </script>
</body>
</html>
