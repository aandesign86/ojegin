<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEGIN - Ojek Online Lokal</title>
  <!-- Tailwind CSS untuk Tampilan Modern -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden min-h-[600px] flex flex-col justify-between">
    
    <!-- Header OJEGIN -->
    <div class="bg-emerald-600 p-6 text-white text-center">
      <h1 class="text-3xl font-extrabold tracking-wider">OJEGIN</h1>
      <p class="text-xs opacity-80 mt-1">Solusi Transportasi & Kurir Cepat</p>
    </div>

    <!-- Konten Utama / Form Pemesanan -->
    <div class="p-6 flex-1 flex flex-col justify-center space-y-4">
      <h2 class="text-lg font-bold text-gray-800 text-center">Pesan Layanan OJEGIN</h2>
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Lokasi Jemput</label>
        <input type="text" id="jemput" placeholder="Masukkan lokasi jemput..." class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Lokasi Tujuan</label>
        <input type="text" id="tujuan" placeholder="Masukkan lokasi tujuan..." class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Layanan</label>
        <select id="layanan" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-emerald-500">
          <option value="OJEGIN Ride">OJEGIN Ride (Motor)</option>
          <option value="OJEGIN Car">OJEGIN Car (Mobil)</option>
          <option value="OJEGIN Send">OJEGIN Send (Kirim Barang)</option>
        </select>
      </div>

      <button onclick="buatPesanan()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
        Pesan Sekarang
      </button>

      <div id="status-pesanan" class="hidden p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-center text-xs text-emerald-800 font-semibold">
        Mencari Driver OJEGIN terdekat...
      </div>
    </div>

    <!-- Footer -->
    <div class="p-4 bg-gray-50 border-t text-center text-xs text-gray-500">
      &copy; 2026 OJEGIN Indonesia
    </div>

  </div>

  <!-- Firebase SDK (Version 9+ Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Proyek Firebase milikmu
    const firebaseConfig = {
      apiKey: "ISI_DENGAN_API_KEY_FIREBASE_KAMU",
      authDomain: "PROJECT_ID_KAMU.firebaseapp.com",
      projectId: "PROJECT_ID_KAMU",
      storageBucket: "PROJECT_ID_KAMU.appspot.com",
      messagingSenderId: "SENDER_ID_KAMU",
      appId: "APP_ID_KAMU"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fungsi Kirim Pesanan ke Database
    window.buatPesanan = async function() {
      const lokasiJemput = document.getElementById('jemput').value;
      const lokasiTujuan = document.getElementById('tujuan').value;
      const jenisLayanan = document.getElementById('layanan').value;

      if (!lokasiJemput || !lokasiTujuan) {
        alert("Harap isi lokasi jemput dan tujuan!");
        return;
      }

      try {
        // Simpan data ke koleksi 'orders' di Cloud Firestore
        await addDoc(collection(db, "orders"), {
          layanan: jenisLayanan,
          lokasi_jemput: lokasiJemput,
          lokasi_tujuan: lokasiTujuan,
          status: "SEARCHING",
          created_at: serverTimestamp()
        });

        document.getElementById('status-pesanan').classList.remove('hidden');
        alert("Pesanan OJEGIN berhasil dibuat!");
      } catch (e) {
        console.error("Gagal membuat pesanan: ", e);
        alert("Terjadi kesalahan koneksi ke Firebase.");
      }
    };
  </script>
</body>
</html>
