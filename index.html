<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEGIN - Layanan Utama</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

  <!-- Main Header Container -->
  <header class="bg-emerald-600 text-white p-5 rounded-b-3xl shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center mb-4">
      <div>
        <h1 class="text-2xl font-black tracking-wider">OJEGIN</h1>
        <p class="text-xs text-emerald-100">Hai, <span id="user-name" class="font-bold">Pelanggan</span>!</p>
      </div>
      <button onclick="logout()" class="text-xs bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg border border-emerald-500">Keluar</button>
    </div>

    <!-- Saldo OJE-Pay Dummy -->
    <div class="max-w-md mx-auto bg-white/10 backdrop-blur-sm p-3 rounded-xl flex justify-between items-center text-xs">
      <div>
        <p class="text-emerald-100">Saldo OJE-Pay</p>
        <p class="text-base font-bold">Rp 50.000</p>
      </div>
      <button class="bg-white text-emerald-700 px-3 py-1 rounded-lg font-bold shadow-sm">+ Isi Saldo</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- Grid Menu Layanan -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 grid grid-cols-4 gap-4 text-center">
      <button onclick="selectService('OJEGIN Ride')" class="flex flex-col items-center space-y-1">
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-xl font-bold">🛵</div>
        <span class="text-xs font-semibold text-gray-700">Ride</span>
      </button>

      <button onclick="selectService('OJEGIN Car')" class="flex flex-col items-center space-y-1">
        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-xl font-bold">🚗</div>
        <span class="text-xs font-semibold text-gray-700">Car</span>
      </button>

      <button onclick="selectService('OJEGIN Food')" class="flex flex-col items-center space-y-1">
        <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center text-xl font-bold">🍔</div>
        <span class="text-xs font-semibold text-gray-700">Food</span>
      </button>

      <button onclick="selectService('OJEGIN Send')" class="flex flex-col items-center space-y-1">
        <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-xl font-bold">📦</div>
        <span class="text-xs font-semibold text-gray-700">Send</span>
      </button>
    </div>

    <!-- Form Pemesanan Perjalanan -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
      <h2 id="service-title" class="text-sm font-bold text-gray-800">Pesan OJEGIN Ride</h2>

      <div>
        <label class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Lokasi Jemput</label>
        <input type="text" id="loc-pickup" placeholder="Masukkan lokasi penjemputan" class="w-full p-2.5 bg-gray-50 border rounded-lg text-xs focus:outline-emerald-500">
      </div>

      <div>
        <label class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Lokasi Tujuan</label>
        <input type="text" id="loc-destination" placeholder="Masukkan lokasi tujuan" class="w-full p-2.5 bg-gray-50 border rounded-lg text-xs focus:outline-emerald-500">
      </div>

      <button onclick="createOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs shadow-md transition">Pesan Sekarang</button>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhY_GI48jtnzZ0XpOTLY66iaTUW3qwe_8",
      authDomain: "ojegin-92c72.firebaseapp.com",
      projectId: "ojegin-92c72",
      storageBucket: "ojegin-92c72.firebasestorage.app",
      messagingSenderId: "1077908821084",
      appId: "1:1077908821084:web:873b3d23ead38cb8c94299"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    let selectedType = "OJEGIN Ride";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) document.getElementById("user-name").innerText = snap.data().nama;
      } else {
        window.location.href = "login.html";
      }
    });

    window.logout = function() { signOut(auth); };

    window.selectService = function(type) {
      selectedType = type;
      document.getElementById("service-title").innerText = "Pesan " + type;
    };

    window.createOrder = async function() {
      const pickup = document.getElementById("loc-pickup").value;
      const dest = document.getElementById("loc-destination").value;

      if (!pickup || !dest) {
        alert("Lengkapi lokasi jemput dan tujuan!");
        return;
      }

      await addDoc(collection(db, "orders"), {
        customerId: currentUser.uid,
        jenis: selectedType,
        penjemputan: pickup,
        tujuan: dest,
        status: "MENUNGGU_DRIVER",
        created_at: serverTimestamp()
      });

      alert("Pesanan berhasil dibuat! Mencari driver terdekat...");
      document.getElementById("loc-pickup").value = "";
      document.getElementById("loc-destination").value = "";
    };
  </script>
</body>
</html>
